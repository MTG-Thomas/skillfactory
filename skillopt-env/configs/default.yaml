_base_: ../_base_/default.yaml

env:
  name: incidentrca
  split_dir: ""
  data_path: ""
  split_mode: split_dir
  workers: 4
  max_completion_tokens: 2048
  limit: 0

train:
  num_epochs: 3
  batch_size: 4
  accumulation: 1
  seed: 42

gradient:
  analyst_workers: 4
  minibatch_size: 4
  merge_batch_size: 4

optimizer:
  learning_rate: 4
  lr_scheduler: constant
  use_slow_update: false
  use_meta_skill: false

evaluation:
  use_gate: true
  eval_test: false

model:
  optimizer_backend: openai_compatible
  target_backend: openai_compatible
  reasoning_effort: medium
